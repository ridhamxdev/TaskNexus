<div class="space-y-4">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div>
      <h2 class="text-xl font-semibold text-gray-900 dark:text-white">
        Email Management
      </h2>
      <p class="text-sm text-gray-600 dark:text-gray-400">
        Manage system emails and email status
      </p>
    </div>
    <div class="flex items-center gap-2">
      <button 
        (click)="loadEmails()"
        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-500 transition-colors">
        <i class="pi pi-refresh mr-2"></i>
        Refresh
      </button>
    </div>
  </div>

  <!-- Error Message -->
  <div *ngIf="emailsError" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
    {{ emailsError }}
  </div>

  <!-- Filters -->
  <div class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow-sm">
    <!-- Quick Filters -->
    <div class="flex flex-wrap gap-2 mb-4">
      <button 
        (click)="filterEmailsByStatus('all')"
        [class]="emailFilter === 'all' ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-700'"
        class="px-3 py-2 rounded-lg text-sm">
        All ({{ emails.length }})
      </button>
      <button 
        (click)="filterEmailsByStatus('SENT')"
        [class]="emailFilter === 'SENT' ? 'bg-green-500 text-white' : 'bg-gray-200 text-gray-700'"
        class="px-3 py-2 rounded-lg text-sm">
        Sent ({{ getEmailsByStatus('SENT').length }})
      </button>
      <button 
        (click)="filterEmailsByStatus('FAILED')"
        [class]="emailFilter === 'FAILED' ? 'bg-red-500 text-white' : 'bg-gray-200 text-gray-700'"
        class="px-3 py-2 rounded-lg text-sm">
        Failed ({{ getEmailsByStatus('FAILED').length }})
      </button>
      <button 
        (click)="filterEmailsByStatus('PENDING')"
        [class]="emailFilter === 'PENDING' ? 'bg-yellow-500 text-white' : 'bg-gray-200 text-gray-700'"
        class="px-3 py-2 rounded-lg text-sm">
        Pending ({{ getEmailsByStatus('PENDING').length }})
      </button>
    </div>

    <!-- Search Bar -->
    <div class="flex flex-col sm:flex-row gap-4 mb-4">
      <div class="flex-1">
        <input 
          type="text" 
          [(ngModel)]="emailSearchTerm"
          (ngModelChange)="onEmailSearchChange()"
          placeholder="Search emails by subject, recipient, or content..."
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
      </div>
      <div class="flex gap-2">
        <button 
          (click)="toggleEmailFilters()"
          class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-500 transition-colors">
          <i class="pi pi-filter mr-2"></i>
          Advanced Filters
        </button>
        <button 
          (click)="clearEmailFilters()"
          class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-500 transition-colors">
          <i class="pi pi-times mr-2"></i>
          Clear
        </button>
      </div>
    </div>

    <!-- Advanced Filters Panel -->
    <div *ngIf="showEmailFilters" class="border-t pt-4">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Date Range -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
            Date Range
          </label>
          <div class="flex gap-2">
            <input 
              type="date" 
              [(ngModel)]="emailDateFromFilter"
              (ngModelChange)="onEmailDateChange()"
              class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            <input 
              type="date" 
              [(ngModel)]="emailDateToFilter"
              (ngModelChange)="onEmailDateChange()"
              class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
          </div>
        </div>

        <!-- Recipient Filter -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
            Recipient
          </label>
          <input 
            type="text" 
            [(ngModel)]="emailRecipientFilter"
            (ngModelChange)="onEmailFilterChange()"
            placeholder="Filter by recipient email..."
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
        </div>

        <!-- Subject Filter -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
            Subject
          </label>
          <input 
            type="text" 
            [(ngModel)]="emailSubjectFilter"
            (ngModelChange)="onEmailFilterChange()"
            placeholder="Filter by subject..."
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
        </div>
      </div>
    </div>
  </div>

  <!-- Email List -->
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
        <thead class="bg-gray-50 dark:bg-gray-700">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
              ID
            </th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
              To
            </th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
              Subject
            </th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
              Status
            </th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
              Sent At
            </th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
              Actions
            </th>
          </tr>
        </thead>
        <tbody class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
          <tr *ngFor="let email of paginatedEmails; trackBy: trackByEmail" 
              class="hover:bg-gray-50 dark:hover:bg-gray-700">
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 dark:text-white">
              #{{ email.id }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-900 dark:text-white">{{ email.to }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-900 dark:text-white truncate max-w-xs">
                {{ email.subject }}
              </div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span [class]="getStatusColor(email.status)" 
                    class="inline-flex px-2 py-1 text-xs font-semibold rounded-full">
                {{ email.status }}
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
              {{ formatDate(email.sentAt) }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
              <button 
                *ngIf="email.status === 'FAILED'"
                (click)="resendEmail(email)"
                class="text-blue-600 hover:text-blue-900 dark:text-blue-400 dark:hover:text-blue-300 mr-3">
                <i class="pi pi-refresh mr-1"></i>
                Resend
              </button>
              <button 
                class="text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-300">
                <i class="pi pi-eye mr-1"></i>
                View
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="bg-white dark:bg-gray-800 px-4 py-3 flex items-center justify-between border-t border-gray-200 dark:border-gray-700 sm:px-6">
      <div class="flex-1 flex justify-between sm:hidden">
        <button 
          [disabled]="emailCurrentPage === 1"
          (click)="previousEmailPage()"
          class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
          Previous
        </button>
        <button 
          [disabled]="emailCurrentPage === emailTotalPages"
          (click)="nextEmailPage()"
          class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
          Next
        </button>
      </div>
      <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
        <div class="flex items-center gap-4">
          <p class="text-sm text-gray-700 dark:text-gray-300">
            {{ emailPaginationInfo }}
          </p>
          <select 
            [(ngModel)]="emailItemsPerPage"
            (ngModelChange)="changeEmailPageSize($event)"
            class="px-3 py-1 border border-gray-300 rounded-md text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            <option *ngFor="let size of emailPageSizes" [value]="size">{{ size }} per page</option>
          </select>
        </div>
        <div>
          <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
            <button 
              [disabled]="emailCurrentPage === 1"
              (click)="previousEmailPage()"
              class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
              <i class="pi pi-chevron-left"></i>
            </button>
            <button 
              *ngFor="let page of [].constructor(emailTotalPages); let i = index"
              [class]="(i + 1) === emailCurrentPage ? 'bg-blue-50 border-blue-500 text-blue-600' : 'bg-white border-gray-300 text-gray-500 hover:bg-gray-50'"
              (click)="goToEmailPage(i + 1)"
              class="relative inline-flex items-center px-4 py-2 border text-sm font-medium">
              {{ i + 1 }}
            </button>
            <button 
              [disabled]="emailCurrentPage === emailTotalPages"
              (click)="nextEmailPage()"
              class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
              <i class="pi pi-chevron-right"></i>
            </button>
          </nav>
        </div>
      </div>
    </div>
  </div>
</div>
