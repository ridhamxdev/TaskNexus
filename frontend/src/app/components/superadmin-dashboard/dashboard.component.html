<div class="min-h-screen bg-gray-900 text-white">
  <!-- Sidebar Component -->
  <app-sidebar [activeTab]="activeTab" (tabChange)="setActiveTab($event)"></app-sidebar>

  <!-- Main Content -->
  <div class="ml-64 min-h-screen">
    <!-- Header Component -->
    <app-header [activeTab]="activeTab"></app-header>

    <!-- Main Content -->
    <main class="p-6">
      <!-- Global Error Message -->
      <div *ngIf="dataLoadError" class="mb-6 bg-red-900/20 border border-red-500/30 rounded-lg p-4">
        <div class="flex items-center">
          <i class="pi pi-exclamation-triangle text-red-400 mr-3"></i>
          <div>
            <h4 class="text-red-400 font-semibold">Database Connection Error</h4>
            <p class="text-red-300 text-sm mt-1">{{ dataLoadError }}</p>
            <div class="mt-3 flex space-x-3">
              <button 
                (click)="loadSharedData()" 
                class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm transition-colors">
                <i class="pi pi-refresh mr-1"></i>
                Retry Connection
              </button>
              <button 
                (click)="dataLoadError = null" 
                class="bg-gray-600 hover:bg-gray-700 px-3 py-1 rounded text-sm transition-colors">
                Dismiss
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Loading State -->
      <div *ngIf="isLoading" class="flex items-center justify-center min-h-[200px]">
        <div class="flex items-center space-x-3 bg-gray-800 rounded-lg p-4">
          <i class="pi pi-spin pi-spinner text-purple-500 text-xl"></i>
          <span>Loading dashboard data...</span>
        </div>
      </div>

      <!-- Content when not loading -->
      <div *ngIf="!isLoading" class="space-y-6">
        <!-- Dashboard Tab -->
        <div *ngIf="activeTab === 'dashboard'" class="space-y-6">
          <app-dashboard-overview 
            [stats]="dashboardStats"
            [subscriptionStats]="subscriptionStats"
            (quickAction)="handleQuickAction($event)">
            [subscriptionStats]="subscriptionStats">
          </app-dashboard-overview>
        </div>

        <!-- Users Tab -->
        <div *ngIf="activeTab === 'users'" class="space-y-6">
          <app-users-management 
            [users]="users"
            [usersError]="usersError">
          </app-users-management>
        </div>

        <!-- Transactions Tab -->
        <div *ngIf="activeTab === 'transactions'" class="space-y-6">
          <app-transactions-management></app-transactions-management>
        </div>

        <!-- Emails Tab -->
        <div *ngIf="activeTab === 'emails'" class="space-y-6">
          <app-emails-management 
            [emails]="emails"
            [emailsError]="emailsError">
          </app-emails-management>
        </div>

        <!-- Subscriptions Tab -->
        <div *ngIf="activeTab === 'subscriptions'" class="space-y-6">
          <app-subscriptions-management>
          </app-subscriptions-management>
        </div>

        <!-- Settings Tab -->
        <div *ngIf="activeTab === 'settings'" class="space-y-6">
          <app-settings-management 
            [users]="users">
          </app-settings-management>
        </div>

        <!-- Account Statement Tab -->
        <div *ngIf="activeTab === 'statement'" class="space-y-6">
          <app-account-statement [transactions]="transactions"></app-account-statement>
        </div>

        <!-- Default Fees Tab -->
        <div *ngIf="activeTab === 'default-fees'" class="space-y-6">
          <app-default-fee-management></app-default-fee-management>
        </div>
      </div>

      <!-- Loading Overlay -->
      <div *ngIf="isLoading" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-gray-800 rounded-lg p-6 flex items-center space-x-4">
          <i class="pi pi-spin pi-spinner text-purple-500 text-xl"></i>
          <span class="text-white">Loading...</span>
        </div>
      </div>
    </main>
  </div>
</div>
