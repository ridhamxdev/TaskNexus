<div class="relative">
  <!-- Notification Bell Button -->
  <p-button 
    icon="pi pi-bell" 
    [badge]="unreadCount > 0 ? unreadCount.toString() : ''"
    badgeClass="p-badge-danger"
    class="p-button-text p-button-rounded"
    severity="secondary"
    size="small"
    (click)="op.toggle($event)"
    [pTooltip]="unreadCount > 0 ? unreadCount + ' unread notifications' : 'No new notifications'"
    tooltipPosition="bottom">
  </p-button>

  <!-- Notification Panel -->
  <p-overlayPanel #op [showCloseIcon]="false" styleClass="notification-panel">
    <ng-template pTemplate="content">
      <div class="w-80 max-w-sm">
        <!-- Header -->
        <div class="flex items-center justify-between p-3 border-b border-gray-700">
          <h3 class="text-lg font-semibold text-white">Notifications</h3>
          <div class="flex gap-2">
            <button 
              *ngIf="unreadCount > 0"
              (click)="markAllAsRead()"
              class="text-xs text-blue-400 hover:text-blue-300 transition-colors"
              title="Mark all as read">
              Mark all read
            </button>
            <button 
              (click)="refreshNotifications()"
              class="text-xs text-gray-400 hover:text-gray-300 transition-colors"
              title="Refresh">
              <i class="pi pi-refresh"></i>
            </button>
          </div>
        </div>

        <!-- Loading State -->
        <div *ngIf="loading" class="p-4 text-center">
          <i class="pi pi-spin pi-spinner text-blue-400 text-xl"></i>
          <p class="text-gray-400 text-sm mt-2">Loading notifications...</p>
        </div>

        <!-- Error State -->
        <div *ngIf="error && !loading" class="p-4 text-center">
          <i class="pi pi-exclamation-triangle text-red-400 text-xl"></i>
          <p class="text-red-400 text-sm mt-2">{{ error }}</p>
          <button 
            (click)="refreshNotifications()"
            class="mt-2 px-3 py-1 bg-red-600 hover:bg-red-700 text-white text-xs rounded transition-colors">
            Retry
          </button>
        </div>

        <!-- Notifications List -->
        <div *ngIf="!loading && !error" class="max-h-96 overflow-y-auto">
          <!-- No Notifications -->
          <div *ngIf="getVisibleNotifications().length === 0" class="p-6 text-center">
            <i class="pi pi-bell-slash text-gray-500 text-3xl mb-3"></i>
            <p class="text-gray-400 text-sm">No notifications yet</p>
          </div>

          <!-- Notification Items -->
          <div 
            *ngFor="let notification of getVisibleNotifications(); trackBy: trackByNotificationId"
            class="notification-item border-b border-gray-700 last:border-b-0 hover:bg-gray-700/30 transition-colors cursor-pointer"
            [class.unread]="notification.status === 'UNREAD'"
            (click)="markAsRead(notification)">
            
            <div class="flex items-start gap-3 p-3">
              <!-- Notification Icon -->
              <div class="flex-shrink-0 mt-1">
                <div class="w-8 h-8 rounded-full flex items-center justify-center"
                     [ngClass]="notification.status === 'UNREAD' ? 'bg-blue-600' : 'bg-gray-600'">
                  <i [class]="'pi ' + getNotificationIcon(notification.type) + ' text-sm text-white'"></i>
                </div>
              </div>

              <!-- Notification Content -->
              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-2">
                  <h4 class="text-sm font-medium text-white truncate" 
                      [class.font-semibold]="notification.status === 'UNREAD'">
                    {{ notification.title }}
                  </h4>
                  
                  <!-- Actions -->
                  <div class="flex items-center gap-1 flex-shrink-0">
                    <span class="text-xs text-gray-400">{{ formatTime(notification.createdAt) }}</span>
                    <button 
                      (click)="dismissNotification(notification, $event)"
                      class="opacity-0 group-hover:opacity-100 ml-1 text-gray-400 hover:text-red-400 transition-all"
                      title="Dismiss">
                      <i class="pi pi-times text-xs"></i>
                    </button>
                  </div>
                </div>
                
                <p class="text-sm text-gray-300 mt-1 line-clamp-2">{{ notification.message }}</p>
                
                <!-- Unread Indicator -->
                <div *ngIf="notification.status === 'UNREAD'" class="flex items-center gap-1 mt-2">
                  <div class="w-2 h-2 bg-blue-400 rounded-full"></div>
                  <span class="text-xs text-blue-400">New</span>
                </div>
              </div>
            </div>
          </div>

          <!-- More Notifications Indicator -->
          <div *ngIf="hasMoreNotifications()" class="p-3 text-center border-t border-gray-700">
            <p class="text-xs text-gray-400">
              {{ getMoreNotificationsCount() }} more notifications
            </p>
          </div>
        </div>

        <!-- Footer -->
        <div *ngIf="!loading && !error && getVisibleNotifications().length > 0" 
             class="p-3 border-t border-gray-700 text-center">
          <a routerLink="/notifications" class="text-xs text-blue-400 hover:text-blue-300 transition-colors">
            View All Notifications
          </a>
        </div>
      </div>
    </ng-template>
  </p-overlayPanel>
</div>
